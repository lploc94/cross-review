<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 188" width="822" height="188" role="img" aria-label="F1, recall and precision by reviewer on real bugs, with 95% intervals">
<style>
.s-codex{--c:#2448b8} .s-claude{--c:#d1490f} .s-agy{--c:#0e8f86} .s-none{--c:#8a877f}
svg{font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.grid{stroke:#efece4;stroke-width:1}
.axis-tick{fill:#8a877f;font-size:11.5px;font-variant-numeric:tabular-nums}
.axis{fill:#4a4843;font-size:12.5px}
.contour{fill:none;stroke:#8a877f;stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.contour-label{fill:#8a877f;font-size:11px}
.panel-title,.group-title{fill:#1c1b19;font-size:13.5px;font-weight:600}
.row-label{fill:#4a4843;font-size:12.5px}
.value{fill:#1c1b19;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.label{fill:#1c1b19;font-size:13px;font-weight:600;paint-order:stroke;stroke:#fffefb;stroke-width:4px}
.ci{stroke:var(--c);stroke-width:2;stroke-linecap:round;opacity:.55}
.dot{fill:var(--c);stroke:#fffefb;stroke-width:2}
.bar{fill:var(--c)}
.line{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.hit{fill:transparent}</style>
<rect width="100%" height="100%" rx="8" fill="#fffefb" stroke="#e3e0d7"/>
<g transform="translate(16,16)"><text class="panel-title" x="0" y="16">F1, real bugs</text><line class="grid" x1="86" x2="86" y1="24" y2="130"/><text class="axis-tick" x="86" y="146" text-anchor="middle">0.3</text><line class="grid" x1="112" x2="112" y1="24" y2="130"/><text class="axis-tick" x="112" y="146" text-anchor="middle">0.4</text><line class="grid" x1="138" x2="138" y1="24" y2="130"/><text class="axis-tick" x="138" y="146" text-anchor="middle">0.5</text><line class="grid" x1="164" x2="164" y1="24" y2="130"/><text class="axis-tick" x="164" y="146" text-anchor="middle">0.6</text><line class="grid" x1="190" x2="190" y1="24" y2="130"/><text class="axis-tick" x="190" y="146" text-anchor="middle">0.7</text><line class="grid" x1="216" x2="216" y1="24" y2="130"/><text class="axis-tick" x="216" y="146" text-anchor="middle">0.8</text><g class="mk s-codex"><title>Codex · F1, real bugs: 0.582 [95% CI 0.495, 0.663]</title><rect class="hit" x="0" y="30" width="250" height="32"/><text class="row-label" x="0" y="50">Codex</text><line class="ci" x1="136.7" x2="180.4" y1="46" y2="46"/><circle class="dot" cx="159.3" cy="46" r="6"/><text class="value" x="186.4" y="50">0.58</text></g><g class="mk s-claude"><title>Claude Code · F1, real bugs: 0.528 [95% CI 0.469, 0.589]</title><rect class="hit" x="0" y="62" width="250" height="32"/><text class="row-label" x="0" y="82">Claude Code</text><line class="ci" x1="129.9" x2="161.1" y1="78" y2="78"/><circle class="dot" cx="145.3" cy="78" r="6"/><text class="value" x="167.1" y="82">0.53</text></g><g class="mk s-agy"><title>Antigravity · F1, real bugs: 0.448 [95% CI 0.361, 0.539]</title><rect class="hit" x="0" y="94" width="250" height="32"/><text class="row-label" x="0" y="114">Antigravity</text><line class="ci" x1="101.9" x2="148.1" y1="110" y2="110"/><circle class="dot" cx="124.5" cy="110" r="6"/><text class="value" x="154.1" y="114">0.45</text></g></g>
<g transform="translate(286,16)"><text class="panel-title" x="0" y="16">Recall, real bugs</text><line class="grid" x1="86" x2="86" y1="24" y2="130"/><text class="axis-tick" x="86" y="146" text-anchor="middle">0.2</text><line class="grid" x1="107.7" x2="107.7" y1="24" y2="130"/><text class="axis-tick" x="107.7" y="146" text-anchor="middle">0.3</text><line class="grid" x1="129.3" x2="129.3" y1="24" y2="130"/><text class="axis-tick" x="129.3" y="146" text-anchor="middle">0.4</text><line class="grid" x1="151" x2="151" y1="24" y2="130"/><text class="axis-tick" x="151" y="146" text-anchor="middle">0.5</text><line class="grid" x1="172.7" x2="172.7" y1="24" y2="130"/><text class="axis-tick" x="172.7" y="146" text-anchor="middle">0.6</text><line class="grid" x1="194.3" x2="194.3" y1="24" y2="130"/><text class="axis-tick" x="194.3" y="146" text-anchor="middle">0.7</text><line class="grid" x1="216" x2="216" y1="24" y2="130"/><text class="axis-tick" x="216" y="146" text-anchor="middle">0.8</text><g class="mk s-codex"><title>Codex · Recall, real bugs: 0.531 [95% CI 0.406, 0.671]</title><rect class="hit" x="0" y="30" width="250" height="32"/><text class="row-label" x="0" y="50">Codex</text><line class="ci" x1="130.6" x2="188" y1="46" y2="46"/><circle class="dot" cx="157.7" cy="46" r="6"/><text class="value" x="194" y="50">0.53</text></g><g class="mk s-claude"><title>Claude Code · Recall, real bugs: 0.494 [95% CI 0.409, 0.605]</title><rect class="hit" x="0" y="62" width="250" height="32"/><text class="row-label" x="0" y="82">Claude Code</text><line class="ci" x1="131.3" x2="173.7" y1="78" y2="78"/><circle class="dot" cx="149.7" cy="78" r="6"/><text class="value" x="179.7" y="82">0.49</text></g><g class="mk s-agy"><title>Antigravity · Recall, real bugs: 0.318 [95% CI 0.237, 0.426]</title><rect class="hit" x="0" y="94" width="250" height="32"/><text class="row-label" x="0" y="114">Antigravity</text><line class="ci" x1="94" x2="135" y1="110" y2="110"/><circle class="dot" cx="111.6" cy="110" r="6"/><text class="value" x="141" y="114">0.32</text></g></g>
<g transform="translate(556,16)"><text class="panel-title" x="0" y="16">Precision, real bugs</text><line class="grid" x1="86" x2="86" y1="24" y2="130"/><text class="axis-tick" x="86" y="146" text-anchor="middle">0.4</text><line class="grid" x1="112" x2="112" y1="24" y2="130"/><text class="axis-tick" x="112" y="146" text-anchor="middle">0.5</text><line class="grid" x1="138" x2="138" y1="24" y2="130"/><text class="axis-tick" x="138" y="146" text-anchor="middle">0.6</text><line class="grid" x1="164" x2="164" y1="24" y2="130"/><text class="axis-tick" x="164" y="146" text-anchor="middle">0.7</text><line class="grid" x1="190" x2="190" y1="24" y2="130"/><text class="axis-tick" x="190" y="146" text-anchor="middle">0.8</text><line class="grid" x1="216" x2="216" y1="24" y2="130"/><text class="axis-tick" x="216" y="146" text-anchor="middle">0.9</text><g class="mk s-codex"><title>Codex · Precision, real bugs: 0.643 [95% CI 0.566, 0.714]</title><rect class="hit" x="0" y="30" width="250" height="32"/><text class="row-label" x="0" y="50">Codex</text><line class="ci" x1="129.2" x2="167.6" y1="46" y2="46"/><circle class="dot" cx="149.2" cy="46" r="6"/><text class="value" x="173.6" y="50">0.64</text></g><g class="mk s-claude"><title>Claude Code · Precision, real bugs: 0.568 [95% CI 0.499, 0.637]</title><rect class="hit" x="0" y="62" width="250" height="32"/><text class="row-label" x="0" y="82">Claude Code</text><line class="ci" x1="111.7" x2="147.6" y1="78" y2="78"/><circle class="dot" cx="129.7" cy="78" r="6"/><text class="value" x="153.6" y="82">0.57</text></g><g class="mk s-agy"><title>Antigravity · Precision, real bugs: 0.756 [95% CI 0.658, 0.848]</title><rect class="hit" x="0" y="94" width="250" height="32"/><text class="row-label" x="0" y="114">Antigravity</text><line class="ci" x1="153.1" x2="202.5" y1="110" y2="110"/><circle class="dot" cx="178.6" cy="110" r="6"/><text class="value" x="208.5" y="114">0.76</text></g></g>
</svg>
