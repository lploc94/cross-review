<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 202" width="672" height="202" role="img" aria-label="Real defects nobody planted, found by each reviewer, out of 60">
<style>
.s-codex{--c:#2448b8} .s-claude{--c:#d1490f} .s-agy{--c:#0e8f86} .s-none{--c:#8a877f}
svg{font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.grid{stroke:#efece4;stroke-width:1}
.axis-tick{fill:#8a877f;font-size:11.5px;font-variant-numeric:tabular-nums}
.axis{fill:#4a4843;font-size:12.5px}
.contour{fill:none;stroke:#8a877f;stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.contour-label{fill:#8a877f;font-size:11px}
.panel-title,.group-title{fill:#1c1b19;font-size:13.5px;font-weight:600}
.row-label{fill:#4a4843;font-size:12.5px}
.value{fill:#1c1b19;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.label{fill:#1c1b19;font-size:13px;font-weight:600;paint-order:stroke;stroke:#fffefb;stroke-width:4px}
.ci{stroke:var(--c);stroke-width:2;stroke-linecap:round;opacity:.55}
.dot{fill:var(--c);stroke:#fffefb;stroke-width:2}
.bar{fill:var(--c)}
.line{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.hit{fill:transparent}</style>
<rect width="100%" height="100%" rx="8" fill="#fffefb" stroke="#e3e0d7"/>
<g transform="translate(16,16)"><line class="grid" x1="110" x2="110" y1="8" y2="140"/><text class="axis-tick" x="110" y="158" text-anchor="middle">0</text><line class="grid" x1="178.3" x2="178.3" y1="8" y2="140"/><text class="axis-tick" x="178.3" y="158" text-anchor="middle">10</text><line class="grid" x1="246.7" x2="246.7" y1="8" y2="140"/><text class="axis-tick" x="246.7" y="158" text-anchor="middle">20</text><line class="grid" x1="315" x2="315" y1="8" y2="140"/><text class="axis-tick" x="315" y="158" text-anchor="middle">30</text><line class="grid" x1="383.3" x2="383.3" y1="8" y2="140"/><text class="axis-tick" x="383.3" y="158" text-anchor="middle">40</text><line class="grid" x1="451.7" x2="451.7" y1="8" y2="140"/><text class="axis-tick" x="451.7" y="158" text-anchor="middle">50</text><line class="grid" x1="520" x2="520" y1="8" y2="140"/><text class="axis-tick" x="520" y="158" text-anchor="middle">60</text><g class="mk s-codex"><title>Codex: found 48 of the 60 unplanted defects in at least one run</title><rect class="hit" x="0" y="8" width="640" height="44"/><text class="row-label" x="0" y="34">Codex</text><path class="bar" d="M110,17h324a4,4 0 0 1 4,4v18a4,4 0 0 1 -4,4h-324z"/><text class="value" x="446" y="34">48 of 60</text></g><g class="mk s-claude"><title>Claude Code: found 47 of the 60 unplanted defects in at least one run</title><rect class="hit" x="0" y="52" width="640" height="44"/><text class="row-label" x="0" y="78">Claude Code</text><path class="bar" d="M110,61h317.2a4,4 0 0 1 4,4v18a4,4 0 0 1 -4,4h-317.2z"/><text class="value" x="439.2" y="78">47 of 60</text></g><g class="mk s-agy"><title>Antigravity: found 14 of the 60 unplanted defects in at least one run</title><rect class="hit" x="0" y="96" width="640" height="44"/><text class="row-label" x="0" y="122">Antigravity</text><path class="bar" d="M110,105h91.7a4,4 0 0 1 4,4v18a4,4 0 0 1 -4,4h-91.7z"/><text class="value" x="213.7" y="122">14 of 60</text></g></g>
</svg>
