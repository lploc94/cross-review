<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 202" width="672" height="202" role="img" aria-label="Share of correct pull requests on which each reviewer raised a false alarm">
<style>
.s-codex{--c:#2448b8} .s-claude{--c:#d1490f} .s-agy{--c:#0e8f86} .s-none{--c:#8a877f}
svg{font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.grid{stroke:#efece4;stroke-width:1}
.axis-tick{fill:#8a877f;font-size:11.5px;font-variant-numeric:tabular-nums}
.axis{fill:#4a4843;font-size:12.5px}
.contour{fill:none;stroke:#8a877f;stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.contour-label{fill:#8a877f;font-size:11px}
.panel-title,.group-title{fill:#1c1b19;font-size:13.5px;font-weight:600}
.row-label{fill:#4a4843;font-size:12.5px}
.value{fill:#1c1b19;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.label{fill:#1c1b19;font-size:13px;font-weight:600;paint-order:stroke;stroke:#fffefb;stroke-width:4px}
.ci{stroke:var(--c);stroke-width:2;stroke-linecap:round;opacity:.55}
.dot{fill:var(--c);stroke:#fffefb;stroke-width:2}
.bar{fill:var(--c)}
.line{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round}
.hit{fill:transparent}</style>
<rect width="100%" height="100%" rx="8" fill="#fffefb" stroke="#e3e0d7"/>
<g transform="translate(16,16)"><line class="grid" x1="110" x2="110" y1="8" y2="140"/><text class="axis-tick" x="110" y="158" text-anchor="middle">0%</text><line class="grid" x1="192" x2="192" y1="8" y2="140"/><text class="axis-tick" x="192" y="158" text-anchor="middle">10%</text><line class="grid" x1="274" x2="274" y1="8" y2="140"/><text class="axis-tick" x="274" y="158" text-anchor="middle">20%</text><line class="grid" x1="356" x2="356" y1="8" y2="140"/><text class="axis-tick" x="356" y="158" text-anchor="middle">30%</text><line class="grid" x1="438" x2="438" y1="8" y2="140"/><text class="axis-tick" x="438" y="158" text-anchor="middle">40%</text><line class="grid" x1="520" x2="520" y1="8" y2="140"/><text class="axis-tick" x="520" y="158" text-anchor="middle">50%</text><g class="mk s-codex"><title>Codex: asked for changes over a non-bug on 47.8% of clean and decoy pull requests</title><rect class="hit" x="0" y="8" width="640" height="44"/><text class="row-label" x="0" y="34">Codex</text><path class="bar" d="M110,17h388a4,4 0 0 1 4,4v18a4,4 0 0 1 -4,4h-388z"/><text class="value" x="510" y="34">47.8%</text></g><g class="mk s-claude"><title>Claude Code: asked for changes over a non-bug on 20.7% of clean and decoy pull requests</title><rect class="hit" x="0" y="52" width="640" height="44"/><text class="row-label" x="0" y="78">Claude Code</text><path class="bar" d="M110,61h165.7a4,4 0 0 1 4,4v18a4,4 0 0 1 -4,4h-165.7z"/><text class="value" x="287.7" y="78">20.7%</text></g><g class="mk s-agy"><title>Antigravity: asked for changes over a non-bug on 5.2% of clean and decoy pull requests</title><rect class="hit" x="0" y="96" width="640" height="44"/><text class="row-label" x="0" y="122">Antigravity</text><path class="bar" d="M110,105h38.6a4,4 0 0 1 4,4v18a4,4 0 0 1 -4,4h-38.6z"/><text class="value" x="160.6" y="122">5.2%</text></g></g>
</svg>
